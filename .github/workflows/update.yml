name: Update profile card

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "go.mod"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Fails the job (and leaves the committed SVGs untouched) on any GitHub API failure.
      - name: Render cards
        run: go run ./cmd/profile-card assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Commit
        run: |
          git config user.name "jaidensiu"
          git config user.email "82122144+jaidensiu@users.noreply.github.com"
          git add assets/dark_mode.svg assets/light_mode.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh profile card"
          git pull --rebase
          git push
